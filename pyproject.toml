[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rankforge"
version = "1.0.0"
description = "Two-stage recommendation service with neural retrieval and reproducible evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "torch>=2.6,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[project.scripts]
rankforge = "rankforge.cli:main"

[tool.setuptools.package-data]
rankforge = ["static/*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["rankforge*"]
exclude = ["tests*"]
